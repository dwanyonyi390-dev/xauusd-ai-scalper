# render.yaml — XAUUSD-AI-SCALPER Blueprint
# Two services:
#   1. Web service  → Express API + Telegram webhook (or polling bot)
#   2. Background worker → news / monitoring / reporting loops
# MongoDB Atlas is external (set MONGODB_URI in the dashboard).
#
# IMPORTANT: Render free web services sleep after idle and free background
# workers do not exist on the free plan. For 24/7 scalping the WEB service
# must be on a paid "Starter" plan and the worker on "Starter". See
# docs/RENDER_DEPLOYMENT.md.

services:
  - type: web
    name: xauusd-ai-scalper-api
    runtime: node
    plan: starter          # free = sleeps + cold starts; NOT suitable for live/demo 24/7
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRADING_MODE
        value: DEMO          # LIVE is refused unless NODE_ENV=production AND explicit flag
      - key: TRADING_SYMBOL
        value: XAUUSD
      - key: MONGODB_URI
        sync: false          # set in dashboard; never commit
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: MT5_AGENT_ID
        sync: false
      - key: MT5_AGENT_SECRET
        sync: false
      - key: MT5_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: NEWS_API_KEY
        sync: false
      - key: ECONOMIC_CALENDAR_API_KEY
        sync: false
      - key: DEFAULT_MAX_POSITIONS
        value: "4"
      - key: DEFAULT_LOT_SIZE
        value: "0.01"
      - key: DEFAULT_PROFIT_TARGET
        value: "0.50"
      - key: DEFAULT_RISK_PERCENT
        value: "0.5"
      - key: DEFAULT_MAX_DAILY_LOSS
        value: "2"
      - key: DEFAULT_MAX_HOLD_SECONDS
        value: "60"
      - key: DEFAULT_MAX_CONSECUTIVE_LOSSES
        value: "3"

  - type: worker
    name: xauusd-ai-scalper-worker
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node src/workers/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRADING_MODE
        value: DEMO
      - key: MONGODB_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: MT5_AGENT_ID
        sync: false
      - key: MT5_AGENT_SECRET
        sync: false